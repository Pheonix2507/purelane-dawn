name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # shopify/theme-check-action@v2 bundles a Node 20 runtime and crashes on
      # the Node 24 runners. Running the CLI this repo already pins means CI and
      # local checks are the same tool at the same version.
      - name: Install
        run: npm ci

      # --fail-level defaults to error, so Dawn's own warnings do not fail the
      # build but a broken Liquid tag does.
      - name: Theme Check
        run: npm run check
